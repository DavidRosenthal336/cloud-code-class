services:
  - type: web
    name: rvc-underwriting
    runtime: node
    plan: free
    branch: claude/rvc-underwriting-app-KP2iv
    buildCommand: npm install --include=dev && npm run build
    startCommand: NODE_ENV=production node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
